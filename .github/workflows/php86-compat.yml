name: PHP 8.6 compatibility

on:
  push:
  pull_request:

jobs:
  php-8-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-check-all
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
